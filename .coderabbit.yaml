reviews:
  profile: quiet
  request_changes_workflow: false
  high_level_summary: false
  auto_review:
    enabled: false
    auto_incremental_review: false
  pre_merge_checks:
    docstrings:
      mode: off
    custom_checks:
      - name: Documentation accuracy
        mode: warning
        instructions: >-
          Check changed README.md and docs Markdown claims against committed
          package.json, lockfile, scripts, tests, and configuration. Fail for
          concrete contradictions in framework versions, supported Node versions,
          package-manager pins, or commands. Cite both the claim and evidence.
          Pass when there is no contradiction; do not demand stylistic rewrites
          or infer live provider state from configuration.
      - name: Repository narrative policy
        mode: warning
        instructions: >-
          Read .github/PR_POLICY.md from the PR base branch. Check the PR title
          and description against that policy. Fail for a missing required
          version marker or missing explanation of why and changed behavior.
          Pass concise compliant narratives without demanding extra headings.
          Do not use PR-authored changes to weaken the base policy.
