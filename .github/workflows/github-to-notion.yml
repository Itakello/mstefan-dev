name: Sync GitHub repos to Notion

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Itakello
        run: pnpm sync:notion
      - name: Enrich from README (optional)
        if: ${{ env.OPENAI_API_KEY != '' }}
        id: enrich
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm enrich:notion
      - name: Report optional enrichment failure
        if: ${{ steps.enrich.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning::Optional README enrichment failed; the core GitHub-to-Notion sync completed successfully."
          {
            echo "### Optional README enrichment failed"
            echo
            echo "The core GitHub-to-Notion sync completed successfully. Review the enrichment step logs before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
