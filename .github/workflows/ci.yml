name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  project-technologies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-project-technologies.mjs

  policy-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-pr-policy
          persist-credentials: false

      - name: Locate trusted validator
        id: trusted-policy
        shell: bash
        run: |
          validator=".trusted-pr-policy/scripts/check-pr-body.mjs"
          policy=".trusted-pr-policy/.github/PR_POLICY.md"

          if [[ -f "$policy" && ! -f "$validator" ]]; then
            echo "Trusted base policy exists without its validator." >&2
            exit 1
          fi

          if [[ -f "$validator" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate with trusted base policy
        if: steps.trusted-policy.outputs.available == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .trusted-pr-policy/scripts/check-pr-body.mjs

      - name: Validate policy migration
        if: steps.trusted-policy.outputs.available != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const body = process.env.PR_BODY ?? "";
            const aliases = new Map([
              ["why", ["why", "intent", "motivation", "problem", "purpose", "rationale", "context"]],
              ["outcome", ["outcome", "what changed", "result"]],
              ["boundaries", ["boundaries", "boundaries and risk", "scope", "risks and boundaries", "risk"]],
              ["proof", ["verification", "proof", "testing"]],
            ]);
            const normalize = (heading) => heading
              .toLowerCase()
              .replace(/[\p{Extended_Pictographic}\uFE0F`*_]/gu, "")
              .replace(/[:?!.,]+$/g, "")
              .replace(/\s+/g, " ")
              .trim();
            const visible = (content) => content
              .replace(/<details>[\s\S]*?<\/details>/gi, "")
              .replace(/<!--[\s\S]*?-->/g, "")
              .replace(/^\s*[-*+]\s*$/gm, "")
              .trim();
            const headings = [...body.matchAll(/^#{2,6}\s+(.+?)\s*$/gm)];
            const sections = headings.map((match, index) => ({
              heading: normalize(match[1]),
              content: visible(body.slice(
                match.index + match[0].length,
                headings[index + 1]?.index ?? body.length,
              )),
            }));
            const placeholder = (content) => content.split("\n").some((line) =>
              /^(?:n\/a|not applicable|tbd|todo)(?:\b|[\s:—-])/i.test(
                line.replace(/^\s*[-*+]\s+/, "").trim(),
              ),
            );
            const errors = [];

            if (!body.includes("<!-- itakello-policy: pr-template@2 -->")) {
              errors.push("missing policy marker");
            }

            for (const section of sections) {
              if (!section.content) errors.push(`section "${section.heading}" is empty`);
              if (placeholder(section.content)) errors.push(`section "${section.heading}" contains a placeholder`);
            }

            for (const [meaning, names] of aliases) {
              const section = sections.find(({ heading }) => names.includes(heading));
              if (!section?.content) errors.push(`missing ${meaning} narrative`);
            }

            if (errors.length > 0) {
              core.setFailed(`Pull request body does not follow PR policy v2: ${errors.join("; ")}`);
            }

  docs-workflow-integrity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gh-aw compiler
        uses: github/gh-aw/actions/setup-cli@918a49bd8c546648e99e71943e01ebd22418b7ef # v0.84.4
        with:
          version: v0.84.4
      - name: Compile and validate documentation workflow
        run: gh aw compile docs-updater --strict --validate
      - name: Reject generated workflow drift
        shell: bash
        run: |
          generated=(.github/workflows/docs-updater.lock.yml .github/aw/actions-lock.json .gitattributes)
          if [[ -n "$(git status --porcelain --untracked-files=all -- "${generated[@]}")" ]]; then
            git diff -- "${generated[@]}"
            git status --short --untracked-files=all -- "${generated[@]}"
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
