name: AI visual review

on:
  workflow_run:
    workflows: [Visual review]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Visual review run ID for the current PR head and base
        required: true
        type: string
      recovery:
        description: Expiring owner-only settlement recovery for PR 133
        required: false
        default: false
        type: boolean

# Serialize claims and the rolling paid-attempt cap; never cancel an in-flight paid request.
concurrency:
  group: ai-visual-review
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch' || inputs.recovery != true
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.recovery == true
        with:
          ref: 175eec0df98b6e4b98672b5f9dd6f6e77ec81a6d
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate bounded attended recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/visual-review/recovery.mjs
      - name: Prepare inert exact-head evidence with trusted review engine
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLED: ${{ vars.MSTEFAN_AI_VISUAL_REVIEW_ENABLED }}
        run: node scripts/visual-review/ai-review.mjs
      - name: Reserve paid AI visual review attempt (${{ steps.prepare.outputs.reserved_micro_usd }} microUSD)
        if: steps.prepare.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLED: ${{ vars.MSTEFAN_AI_VISUAL_REVIEW_ENABLED }}
        run: node scripts/visual-review/ai-review.mjs --request
      - name: Remove prepared request
        if: always()
        run: rm -f "$RUNNER_TEMP/ai-visual-request.json"
