name: PR previews

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, closed, ready_for_review, edited]

permissions: {}

# One shared Worker allowlist; queue every PR event without interrupting writes.
concurrency:
  group: mstefan-pr-preview-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  preview:
    if: github.event_name == 'pull_request_target' && (vars.MSTEFAN_PR_PREVIEWS_ENABLED == 'true' || (vars.MSTEFAN_PR_PREVIEW_CLEANUP_ENABLED == 'true' && (github.event.action == 'closed' || github.event.action == 'edited')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      deployments: write
      id-token: write
    steps:
      - name: Check out trusted default-branch controller
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Join the private OpenShip control network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.MSTEFAN_PREVIEW_TS_CLIENT_ID }}
          audience: ${{ vars.MSTEFAN_PREVIEW_TS_AUDIENCE }}
          tags: tag:mstefan-preview-ci
          ping: 100.111.250.54
          use-cache: 'false'
          log-mode: quiet
      - name: Reconcile the live PR preview
        env:
          PREVIEW_CLOSE_ONLY: ${{ vars.MSTEFAN_PR_PREVIEWS_ENABLED != 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENSHIP_TOKEN: ${{ secrets.MSTEFAN_PREVIEW_OPENSHIP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MSTEFAN_PREVIEW_CLOUDFLARE_TOKEN }}
          PREVIEW_PAYLOAD_SECRET: ${{ secrets.MSTEFAN_PREVIEW_PAYLOAD_SECRET }}
          PREVIEW_DATA_EXPIRY_ENABLED: ${{ vars.MSTEFAN_PR_PREVIEW_DATA_EXPIRY_ENABLED == 'true' }}
          OPENSHIP_PREVIEW_BACKUP_DESTINATION_ID: ${{ vars.MSTEFAN_PREVIEW_BACKUP_DESTINATION_ID }}
          OPENSHIP_PREVIEW_TEMPLATE_ID: ${{ vars.MSTEFAN_PREVIEW_TEMPLATE_ID }}
        run: node scripts/pr-preview/controller.mjs

  sweep:
    if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/master' && vars.MSTEFAN_PR_PREVIEW_CLEANUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      deployments: write
      id-token: write
    steps:
      - name: Check out trusted default-branch controller
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Join the private OpenShip control network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ github.event_name == 'schedule' && vars.MSTEFAN_PREVIEW_SWEEP_TS_CLIENT_ID || vars.MSTEFAN_PREVIEW_MANUAL_TS_CLIENT_ID }}
          audience: ${{ github.event_name == 'schedule' && vars.MSTEFAN_PREVIEW_SWEEP_TS_AUDIENCE || vars.MSTEFAN_PREVIEW_MANUAL_TS_AUDIENCE }}
          tags: tag:mstefan-preview-ci
          ping: 100.111.250.54
          use-cache: 'false'
          log-mode: quiet
      - name: Sweep retained PR previews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENSHIP_TOKEN: ${{ secrets.MSTEFAN_PREVIEW_OPENSHIP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MSTEFAN_PREVIEW_CLOUDFLARE_TOKEN }}
          PREVIEW_PAYLOAD_SECRET: ${{ secrets.MSTEFAN_PREVIEW_PAYLOAD_SECRET }}
          PREVIEW_DATA_EXPIRY_ENABLED: ${{ vars.MSTEFAN_PR_PREVIEW_DATA_EXPIRY_ENABLED == 'true' }}
          OPENSHIP_PREVIEW_BACKUP_DESTINATION_ID: ${{ vars.MSTEFAN_PREVIEW_BACKUP_DESTINATION_ID }}
          OPENSHIP_PREVIEW_TEMPLATE_ID: ${{ vars.MSTEFAN_PREVIEW_TEMPLATE_ID }}
        run: node scripts/pr-preview/sweep.mjs
